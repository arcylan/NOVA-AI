<!DOCTYPE html>
<html>
<head>
    <title>Nova AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin:0;
            font-family: Arial;
            background:#0f172a;
            color:white;
            display:flex;
            flex-direction:column;
            height:100vh;
        }

        header {
            background:#1e293b;
            padding:10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        button.logout {
            background:red;
            border:none;
            color:white;
            padding:6px 10px;
            border-radius:6px;
        }

        #chat {
            flex:1;
            overflow-y:auto;
            padding:10px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .msg {
            padding:10px;
            border-radius:10px;
            max-width:80%;
        }

        .user { align-self:flex-end; background:#3b82f6; }
        .ai { align-self:flex-start; background:#334155; }

        .input-area {
            display:flex;
            padding:10px;
            background:#1e293b;
        }

        input {
            flex:1;
            padding:10px;
            border:none;
            border-radius:6px;
        }

        button.send {
            margin-left:10px;
            background:#22c55e;
            border:none;
            padding:10px;
            border-radius:6px;
            color:white;
        }
    </style>
</head>

<body>

<header>
    <span>Nova AI</span>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div id="chat"></div>

<div class="input-area">
    <input id="input" placeholder="Type..." />
    <button class="send" onclick="send()">Send</button>
</div>

<script>
    const token = localStorage.getItem("token");

    if(!token){
        window.location.href="index.html";
    }

    let chatId;

   async function initChat() {
   console.log("INIT CHAT CALLED");
    try {
        console.log("Initializing chat...");

        // 🔥 Step 1: try to get old chat
        const res = await fetch("http://localhost:8080/chat/last", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        let lastChatId = await res.text();

       if (lastChatId && lastChatId.trim() !== "null" && lastChatId.trim() !== "") {
            // ✅ use existing chat
            chatId = lastChatId;
            console.log("Using old chat:", chatId);
        } else {
            // 🆕 create new only if none exists
            const createRes = await fetch("https://nova-ai-1dzt.onrender.com/chat/create", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            chatId = await createRes.text();
            console.log("Created new chat:", chatId);
        }

    } catch (e) {
        console.error(e);
        alert("Failed to initialize chat");
    }
}

    function add(text,type){
        const chat=document.getElementById("chat");
        const div=document.createElement("div");
        div.className="msg "+type;
        div.innerText=text;
        chat.appendChild(div);
        chat.scrollTop=chat.scrollHeight;
        return div;
    }

    async function send(){
        if(!chatId){
            alert("Chat not ready yet...");
            return;
        }

        const input=document.getElementById("input");
        const msg=input.value.trim();
        if(!msg) return;

        add(msg,"user");
        input.value="";
        const typing=add("Typing...","ai");

        try{
            const res = await fetch(`https://nova-ai-1dzt.onrender.com/api/${chatId}/${encodeURIComponent(msg)}`, {
                    headers:{
                        "Authorization":"Bearer "+token
                    }
                }
            );

            const data = await res.text();
            typing.remove();
            add(data,"ai");

        }catch(e){
            typing.remove();
            add("Error","ai");
        }
    }

    function logout(){
        localStorage.removeItem("token");
        window.location.href="index.html";
    }

    document.getElementById("input").addEventListener("keydown",e=>{
        if(e.key==="Enter") send();
    });

    initChat();
</script>

</body>
</html>
